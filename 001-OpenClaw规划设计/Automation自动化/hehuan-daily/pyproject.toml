[project]
name = "hehuan-daily"
version = "0.1.0"
description = "合欢宗晨间玉简 - 数据源层"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
